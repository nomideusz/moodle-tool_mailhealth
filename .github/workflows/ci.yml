name: Moodle plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.1", moodle: MOODLE_405_STABLE, db: pgsql }
          - { php: "8.3", moodle: MOODLE_405_STABLE, db: mariadb }
          - { php: "8.3", moodle: MOODLE_503_STABLE, db: pgsql }
          - { php: "8.3", moodle: MOODLE_503_STABLE, db: mariadb }
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, xmlrpc, soap, intl
          coverage: none
          ini-values: max_input_vars=5000
      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin; pwd)" >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.db }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      # Every check runs even if an earlier one failed, so one run reports all problems.
      - run: moodle-plugin-ci phplint
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
